---

#### Audit Configuration Settings ####

# Timeout for those cmds that take longer to run where timeout set
audit_cmd_timeout: 120000

# How to retrieve audit binary
# Options are copy or download - detailed settings at the bottom of this file
# you will need to access to either github or the file already downloaded
get_audit_binary_method: download

## if get_audit_binary_method - copy the following needs to be updated for your environment
## it is expected that it will be copied from somewhere accessible to the control node
## e.g copy from ansible control node to remote host
audit_bin_copy_location: /some/accessible/path

# Ability to limit the number of concurrent processes used by the audit binary (syver) (default 50)
audit_max_concurrent: 50

# how to get audit files onto host options
# options are git/copy/archive/get_url other e.g. if you wish to run from already downloaded conf
audit_content: git

# Depending on the method of getting the audit content you may need to validate certs if using git or get_url
# note is self hosted you may not have the cert chain installed so may need to set to false - this is not recommended but may be required in some environments
audit_bin_validate_certs: true

# If using either archive, copy, get_url:
## Note will work with .tar files - zip will require extra configuration
### If using get_url this is expecting github url in tar.gz format e.g.
### https://github.com/ansible-lockdown/SUSE16-CIS-Audit/archive/refs/heads/benchmark-v1.0.0.tar.gz
audit_conf_source: "some path or url to copy from"

# Destination for the audit content to be placed on managed node
# note may not need full path e.g. /opt with the directory being the {{ benchmark }}-Audit directory
audit_conf_dest: "/opt"

### options below this line don't often need changing but can be if your environment requires it
# - e.g. timeout for long running cmds, location of the syver binary if using copy method, url for the syver binary if using download method etc. ###

# if get_audit_binary_method == download change accordingly
# Syver (https://github.com/krameff/syver) is the continuation of the krameff goss fork - a signed fork that is
# regularly updated and reads the same goss.yml audit content
audit_bin_url: "https://github.com/krameff/syver/releases/download/{{ audit_bin_version.release }}/syver-linux-"

### Audit Benchmark content ###
## managed by the control audit_content
# git
audit_file_git: "https://github.com/ansible-lockdown/{{ benchmark }}-Audit.git"
audit_git_version: "benchmark_{{ benchmark_version }}"

## Audit configuration information
# Where the audit configuration will be stored - NOTE benchmark-audit is expected
audit_conf_dir: "{{ audit_conf_dest | default('/opt') }}/{{ benchmark }}-Audit"

# If changed these can affect other products
pre_audit_outfile: "{{ audit_log_dir }}/{{ ansible_facts['hostname'] }}-{{ benchmark }}-{{ benchmark_version }}_pre_scan_{{ ansible_facts['date_time']['epoch'] }}.{{ audit_format }}"
post_audit_outfile: "{{ audit_log_dir }}/{{ ansible_facts['hostname'] }}-{{ benchmark }}-{{ benchmark_version }}_post_scan_{{ ansible_facts['date_time']['epoch'] }}.{{ audit_format }}"

## The following should not need changing

### Audit binary settings ###
audit_bin_version:
  release: v0.13.0
  AMD64_checksum: 'sha256:8d1b210b6a9c4e24341e77cde11ed278f809b193a4368b0723e344c04111ae6e'
  ARM64_checksum: 'sha256:c40886ee66b893276299a320abcd3c56b00b6e343ff5343e67cd3b348390a8a7'
audit_bin_path: /usr/local/bin/
audit_bin: "{{ audit_bin_path }}syver"
audit_format: json

audit_vars_path: "{{ audit_conf_dir }}/vars/{{ ansible_facts['hostname'] }}.yml"
audit_results: |
  The{% if not audit_only %} pre remediation{% endif %} audit results are: {{ pre_audit_results }}
  {% if not audit_only %}The post remediation audit results are: {{ post_audit_results }}{% endif %}

  Full breakdown can be found in {{ audit_log_dir }}

###########################################
### Syver is required on the remote host ###
### see also defaults/main/main.yml     ###

# If the any of the following are set the variables used by them are defined in this file, these can be overridden by your
# preferred method of variable management (e.g., vault, group_vars, host_vars, inventory etc.)

# Allow audit to setup the requirements including installing git (if option chosen and downloading and adding the syver binary to system)
setup_audit: false

# enable audits to run - this runs the audit and get the latest content
run_audit: false

## Only run Audit do not remediate
audit_only: false

# Run heavy tests - some tests can have more impact on a system enabling these can have greater impact on a system
audit_run_heavy_tests: true

# Fetch audit output files back to the controller
fetch_audit_output: false

# Method of getting,uploading the summary files
## Ensure access and permissions are available for these to occur.
## options are
# fetch - fetches from server and moves to location on the ansible controller (could be a mount point available to controller)
# copy - copies file to a location available to the managed node
audit_output_collection_method: fetch

# Where the audit logs are stored
audit_log_dir: '/opt'

# Location to put the audit files
audit_output_destination: "{{ audit_log_dir }}/audit_summaries/"
