---

- name: "3.2.1 | PATCH | Ensure atm kernel module is not available"
  when: rhel10cis_rule_3_2_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_3.2.1
    - atm
    - CCI-000381
    - NIST800-53R5_CM-7
  ansible.builtin.lineinfile:
    path: /etc/modprobe.d/60-atm.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    create: true
    mode: 'u-x,go-rwx'
  loop:
    - { regexp: '^\s*#?\s*install\s+atm(\s|$)', line: install atm /bin/true }
    - { regexp: '^\s*#?\s*blacklist\s+atm(\s|$)', line: blacklist atm }

