---

- name: "4.1.1 | PATCH | Ensure firewalld is installed"
  when:
    - rhel10cis_rule_4_1_1
    - rhel10cis_firewall == 'firewalld'
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - firewalld
    - rule_4.1.1
    - NIST800-53R5_CA-9
  ansible.builtin.package:
    name: firewalld
    state: present

- name: "4.1.2 | PATCH | Ensure firewalld backend is configured"
  when: rhel10cis_rule_4_1_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - firewalld
    - rule_4.1.2
    - NIST800-53R5_CA-9
  ansible.builtin.lineinfile:
    path: /etc/firewalld/firewalld.conf
    regexp: ^FirewallBackend\s*=\s*iptables
    line: FirewallBackend=nftables

- name: "4.1.3 | PATCH | Ensure firewalld.service is configured"
  when: rhel10cis_rule_4_1_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - firewalld
    - rule_4.1.3
    - NIST800-53R5_NA
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: "4.1.4 | PATCH | Ensure firewalld active zone target is configured"
  when: rhel10cis_rule_4_1_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - firewalld
    - rule_4.1.4
    - NIST800-53R5_NA
  block:
    - name: "4.1.4 | PATCH | Ensure firewalld active zone target is configured | Ensure active zone is set"
      ansible.posix.firewalld:
        zone: "{{ rhel10cis_active_firewall_zone }}"
        permanent: true
        state: present
      notify: Reload firewalld

    - name: "4.1.4 | AUDIT | Ensure firewalld active zone target is configured | Get active zone targets"
      ansible.builtin.shell: |
        set -o pipefail
        firewall-cmd --get-active-zones | awk '!/^[[:space:]]/ {print $1}' | while read -r l_zone; do
          l_interfaces="$(firewall-cmd --zone="$l_zone" --list-interfaces)"
          if [ -n "$l_interfaces" ] && [ -z "$(tr ' ' '\n' <<< "$l_interfaces" | grep -Pv '^(lo|virbr\S+)?$')" ]; then
            continue
          fi
          l_target="$(firewall-cmd --zone="$l_zone" --list-all | awk '/^[[:space:]]*target:/ {print $2}')"
          l_ptarget="$(firewall-cmd --permanent --zone="$l_zone" --get-target)"
          echo "${l_zone}:${l_target}:${l_ptarget}"
        done
      args:
        executable: "{{ rhel10cis_shell_executable }}"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_firewalld_zone_targets

    - name: "4.1.4 | PATCH | Ensure firewalld active zone target is configured | Allow ssh before changing zone target"
      when:
        - rhel10cis_disruption_high
        - item.split(':')[2] | upper == 'ACCEPT'
      ansible.posix.firewalld:
        zone: "{{ item.split(':')[0] }}"
        service: ssh
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ discovered_firewalld_zone_targets.stdout_lines }}"

    - name: "4.1.4 | PATCH | Ensure firewalld active zone target is configured | Set permanent zone target"
      when:
        - rhel10cis_disruption_high
        - item.split(':')[2] | upper == 'ACCEPT'
      ansible.posix.firewalld:
        zone: "{{ item.split(':')[0] }}"
        target: "{{ rhel10cis_firewalld_target }}"
        permanent: true
        state: present
      loop: "{{ discovered_firewalld_zone_targets.stdout_lines }}"
      notify: Reload firewalld

    - name: "4.1.4 | PATCH | Ensure firewalld active zone target is configured | Load permanent zone target"
      when:
        - rhel10cis_disruption_high
        - item.split(':')[2] | upper != 'ACCEPT'
        - item.split(':')[1] | upper != item.split(':')[2] | upper
      ansible.builtin.command: firewall-cmd --reload
      changed_when: true
      loop: "{{ discovered_firewalld_zone_targets.stdout_lines }}"

    - name: "4.1.4 | AUDIT | Ensure firewalld active zone target is configured | Warn if not compliant"
      when:
        - not rhel10cis_disruption_high
        - (discovered_firewalld_zone_targets.stdout_lines | length == 0) or
          (discovered_firewalld_zone_targets.stdout_lines | select('match', '^[^:]+:(?!ACCEPT:)([^:]+):\\1$') | list | length !=
          discovered_firewalld_zone_targets.stdout_lines | length)
      block:
        - name: "4.1.4 | AUDIT | Ensure firewalld active zone target is configured | Warn if not compliant | Message"
          ansible.builtin.debug:
            msg:
              - "Warning!! No active zone found, or an active zone target is ACCEPT or not written as a permanent rule"
              - "Set rhel10cis_disruption_high: true to set the target to {{ rhel10cis_firewalld_target }}, or correct manually"
              - "{{ discovered_firewalld_zone_targets.stdout_lines }}"

        - name: "4.1.4 | AUDIT | Ensure firewalld active zone target is configured | Warn if not compliant | Warn count"
          ansible.builtin.import_tasks:
            file: warning_facts.yml
          vars:
            warn_control_id: '4.1.4'

- name: "4.1.5 | PATCH | Ensure firewalld loopback traffic is configured"
  when: rhel10cis_rule_4_1_5
  tags:
    - level1-server
    - level1-workstation
    - manual
    - patch
    - firewalld
    - rule_4.1.5
    - NIST800-53R5_NA
  block:
    - name: "4.1.5 | AUDIT | Ensure firewalld loopback traffic is configured | get loopback zone"
      ansible.builtin.shell: |
        set -o pipefail
        firewall-cmd --list-all --zone="$(firewall-cmd --get-zone-of-interface=lo | xargs)" | grep -Psi -- '^\h*target:\h+\H+'
      args:
        executable: "{{ rhel10cis_shell_executable }}"
      changed_when: false
      check_mode: false
      failed_when: false
      register: discovered_loopback_zone

    - name: "4.1.5 | PATCH | Ensure firewalld loopback traffic is configured | if loopback - no-zone"
      when: "'no zone' in discovered_loopback_zone.stderr"
      ansible.posix.firewalld:
        zone: "{{ rhel10cis_loopback_firewall_zone }}"
        permanent: true
        state: enabled
        interface: lo
      notify: Reload firewalld

    - name: "4.1.5 | PATCH | Ensure firewalld loopback traffic is configured | if loopback - no-zone"
      when: "'ACCEPT' not in discovered_loopback_zone.stdout"
      ansible.posix.firewalld:
        zone: "{{ rhel10cis_loopback_firewall_zone }}"
        permanent: true
        state: enabled
        target: ACCEPT
      notify: Reload firewalld

- name: "4.1.6 | PATCH | Ensure firewalld loopback source address traffic is configured"
  when: rhel10cis_rule_4_1_6
  tags:
    - level1-server
    - level1-workstation
    - manual
    - patch
    - firewalld
    - rule_4.1.6
    - NIST800-53R5_NA
  ansible.posix.firewalld:
    rich_rule: "{{ item }}"
    zone: "{{ rhel10cis_loopback_firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - rule family="ipv4" source address="127.0.0.1" destination not address="127.0.0.1" drop
    - rule family="ipv6" source address="::1" destination not address="::1" drop
  notify: Reload firewalld

- name: "4.1.7 | AUDIT | Ensure firewalld services and ports are configured"
  when: rhel10cis_rule_4_1_7
  tags:
    - level1-server
    - level1-workstation
    - manual
    - audit
    - rule_4.1.7
    - NIST800-55_CA-9
  block:
    - name: "4.1.7 | AUDIT | Ensure firewalld services and ports are configured | Get list of services and ports"
      ansible.builtin.shell: |
        set -o pipefail
        firewall-cmd --get-active-zones | awk '!/:/ {print $1}' | while read ZN; do firewall-cmd --list-all --zone=$ZN; done
      args:
        executable: "{{ rhel10cis_shell_executable }}"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_services_and_ports

    - name: "4.1.7 | AUDIT | Ensure firewalld services and ports are configured | Show services and ports"
      ansible.builtin.debug:
        msg:
          - "The items below are the services and ports that are accepted, please correct as needed"
          - "{{ discovered_services_and_ports.stdout_lines }}"

    - name: "4.1.7 | AUDIT | Ensure firewalld services and ports are configured | Warning count"
      when: discovered_services_and_ports is defined
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "4.1.7"
