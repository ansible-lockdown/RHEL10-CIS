---
# Post tasks

- name: POST | Gather the package facts after remediation
  tags: always
  ansible.builtin.package_facts:
    manager: auto

- name: POST | Update sysctl
  when:
    - rhel10cis_sysctl_update
    - not system_is_container
    - "'procps-ng' in ansible_facts['packages']"
  ansible.builtin.template:
    src: "etc/sysctl.d/{{ item }}.j2"
    dest: "/etc/sysctl.d/{{ item }}"
    owner: root
    group: root
    mode: 'u-x,go-rwx'
  loop:
    - 60-fs_sysctl.conf
    - 60-kernel_sysctl.conf
    - 60-disable_ipv6.conf
    - 60-netipv4_sysctl.conf
    - 60-netipv6_sysctl.conf
  notify:
    - Reload sysctl
    - Sysctl flush ipv4 route table
    - Sysctl flush ipv6 route table

- name: POST | AUDIT | Check running sysctl values against configuration
  when:
    - not system_is_container
    - "'procps-ng' in ansible_facts['packages']"
  ansible.builtin.shell: |
    set -o pipefail
    # Collect configured key=value pairs in the order sysctl --system applies them.
    # /etc/sysctl.conf is read last on this platform, so a later line wins.
    configured=$(for conf_file in /etc/sysctl.d/*.conf /etc/sysctl.conf; do
        [ -r "$conf_file" ] && sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' "$conf_file"
    done | grep '=' | tr -d '[:blank:]')
    drift=0
    for sysctl_key in $(printf '%s\n' "$configured" | cut -d= -f1 | sort -u); do
        [ -n "$sysctl_key" ] || continue
        sysctl_want=$(printf '%s\n' "$configured" | grep "^${sysctl_key}=" | tail -1 | cut -d= -f2-)
        sysctl_have=$(sysctl -n "$sysctl_key" 2>/dev/null) || continue
        [ -n "$sysctl_have" ] || continue
        sysctl_have=$(printf '%s' "$sysctl_have" | tr -d '[:blank:]')
        [ "$sysctl_have" = "$sysctl_want" ] || drift=1
    done
    printf '%s' "$drift"
  args:
    executable: "{{ rhel10cis_shell_executable }}"
  changed_when: false
  failed_when: false
  check_mode: false
  register: discovered_sysctl_drift

- name: POST | Reload sysctl where running values have drifted from configuration
  when:
    - not system_is_container
    - discovered_sysctl_drift.stdout is defined
    - discovered_sysctl_drift.stdout | trim == '1'
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: POST | Flush handlers
  ansible.builtin.meta: flush_handlers

- name: POST | reboot system if changes require it and not skipped
  when: change_requires_reboot
  tags: always
  block:
    - name: POST | Reboot system if changes require it and not skipped
      when: not skip_reboot
      ansible.builtin.reboot:

    - name: POST | Warning a reboot required but skip option set
      when: skip_reboot
      ansible.builtin.debug:
        msg: "Warning!! changes have been made that require a reboot to be implemented but skip reboot was set - Can affect compliance check results"
      changed_when: true

    - name: "POST | Warning a reboot required but skip option set | warning count"
      when: skip_reboot
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: Reboot_required
