---

- name: "PAM | AUDIT | Capture pam security related files"
  when:
    - rhel10cis_rule_5_3_2_2_1 or
      rhel10cis_rule_5_3_2_2_2 or
      rhel10cis_rule_5_3_2_2_3 or
      rhel10cis_rule_5_3_2_2_4 or
      rhel10cis_rule_5_3_2_2_5 or
      rhel10cis_rule_5_3_2_2_6
  tags:
    - level1-server
    - level1-workstation
    - patch
    - pam
    - rule_5.3.2.2.1
    - rule_5.3.2.2.2
    - rule_5.3.2.2.3
    - rule_5.3.2.2.4
    - rule_5.3.2.2.5
    - rule_5.3.2.2.6
  ansible.builtin.find:
    paths:
      - /etc/security/pwquality.conf.d/
    patterns: '*.conf'
  register: prelim_pam_pwquality_confs

- name: "5.3.2.2.1 | PATCH | Ensure password number of changed characters is configured"
  when: rhel10cis_rule_5_3_2_2_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.2.2.1
    - NIST800-53R5_IA-5
    - pam
  block:
    - name: "5.3.2.2.1 | PATCH | Ensure password number of changed characters is configured | Remove difok from conf files except expected file"
      when:
        - item != '/' ~ rhel10cis_passwd_difok_file
        - rhel10cis_disruption_high
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: '^\s*difok\s*='
        state: absent
      loop: "{{ ['/etc/security/pwquality.conf'] + (prelim_pam_pwquality_confs.files | default([]) | map(attribute='path') | list) }}"

    - name: "5.3.2.2.1 | PATCH | Ensure password number of changed characters is configured | Ensure difok file exists"
      ansible.builtin.template:
        src: "{{ rhel10cis_passwd_difok_file }}.j2"
        dest: "/{{ rhel10cis_passwd_difok_file }}"
        owner: root
        group: root
        mode: 'u-x,go-rwx'

    - name: "5.3.2.2.1 | PATCH | Ensure password number of changed characters is configured | Remove difok from pam files Not AuthSelect"
      when:
        - not rhel10cis_allow_authselect_updates
        - rhel10cis_disruption_high
      ansible.builtin.replace:
        path: "/etc/pam.d/{{ item }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_pwquality\.so\b.*?)\s+difok\s*=\s*\S+(.*)$
        replace: \1\2
      loop:
        - password
        - system

    - name: "5.3.2.2.1 | PATCH | Ensure password number of changed characters is configured | Remove difok from pam files AuthSelect"
      when:
        - rhel10cis_allow_authselect_updates
        - rhel10cis_disruption_high
      ansible.builtin.replace:
        path: "/etc/authselect/custom/{{ rhel10cis_authselect_custom_profile_name }}/{{ item }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_pwquality\.so\b.*?)\s+difok\s*=\s*\S+(.*)$
        replace: \1\2
      loop:
        - password
        - system
      notify: Authselect update

