- name: "5.3.2.2.3 | PATCH | Ensure password complexity is configured"
  when: rhel10cis_rule_5_3_2_2_3
  tags:
    - level1-server
    - level1-workstation
    - manual
    - patch
    - rule_5.3.2.2.3
    - NIST800-53R5_IA-5
    - pam
  block:
    - name: "5.3.2.2.3 | PATCH | Ensure password complexity is configured | Remove pwd complex settings from conf files except expected file"
      when:
        - item != '/' ~ rhel10cis_passwd_complex_file
        - rhel10cis_disruption_high
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: '^\s*(minclass|[dulo]credit)\s*='
        state: absent
      loop: "{{ ['/etc/security/pwquality.conf'] + (prelim_pam_pwquality_confs.files | default([]) | map(attribute='path') | list) }}"

    - name: "5.3.2.2.3 | PATCH | Ensure password complexity is configured | Ensure complexity file exists"
      ansible.builtin.template:
        src: "{{ rhel10cis_passwd_complex_file }}.j2"
        dest: "/{{ rhel10cis_passwd_complex_file }}"
        owner: root
        group: root
        mode: 'u-x,go-rwx'

    - name: "5.3.2.2.3 | PATCH | Ensure password complexity is configured | Remove complexity from pam files NOT AuthSelect"
      when:
        - not rhel10cis_allow_authselect_updates
        - rhel10cis_disruption_high
      ansible.builtin.replace:
        path: "/etc/pam.d/{{ item[0] }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_pwquality\.so\b.*?)\s+{{ item[1] }}\s*=\s*\S+(.*)$
        replace: \1\2
      loop: "{{ ['password', 'system'] | product(['minclass', 'dcredit', 'ucredit', 'lcredit', 'ocredit']) | list }}"

    - name: "5.3.2.2.3 | PATCH | Ensure password complexity is configured | Remove complexity from pam files AuthSelect"
      when:
        - rhel10cis_allow_authselect_updates
        - rhel10cis_disruption_high
      ansible.builtin.replace:
        path: "/etc/authselect/custom/{{ rhel10cis_authselect_custom_profile_name }}/{{ item[0] }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_pwquality\.so\b.*?)\s+{{ item[1] }}\s*=\s*\S+(.*)$
        replace: \1\2
      loop: "{{ ['password', 'system'] | product(['minclass', 'dcredit', 'ucredit', 'lcredit', 'ocredit']) | list }}"
      notify: Authselect update

