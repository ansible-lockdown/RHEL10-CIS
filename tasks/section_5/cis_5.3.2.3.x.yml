---

- name: "5.3.2.3.1 | PATCH | Ensure password history remember is configured"
  when: rhel10cis_rule_5_3_2_3_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.2.3.1
    - pam
    - NIST800-53R5_IA-5
  block:
    - name: "5.3.2.3.1 | AUDIT | Ensure password history remember is configured | Check existing files"
      ansible.builtin.shell: |
        set -o pipefail
        grep -Psi -- '^\s*password\s+[^#\n\r]+\s+pam_pwhistory\.so\s+([^#\n\r]+\s+)?remember=\d+\b' /etc/pam.d/password-auth /etc/pam.d/system-auth
      args:
        executable: "{{ rhel10cis_shell_executable }}"
      changed_when: false
      check_mode: false
      failed_when: discovered_pwhistory_remember.rc not in [0, 1]
      register: discovered_pwhistory_remember

    - name: "5.3.2.3.1 | PATCH | Ensure password history remember is configured | Ensure remember is set pwhistory file"
      ansible.builtin.lineinfile:
        path: "/etc/security/pwhistory.conf"
        regexp: remember\s*=\s*\d*
        line: remember = {{ rhel10cis_pamd_pwhistory_remember }}

    - name: "5.3.2.3.1 | PATCH | Ensure password history remember is configured | Remove remember from pam files NOT AuthSelect"
      when:
        - not rhel10cis_allow_authselect_updates
        - rhel10cis_disruption_high
      ansible.builtin.replace:
        path: "/etc/pam.d/{{ item }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_pwhistory\.so\b.*?)\s+remember\s*=\s*\S+(.*)$
        replace: \1\2
      loop:
        - password
        - system

    - name: "5.3.2.3.1 | PATCH | Ensure password history remember is configured | Remove remember from pam files AuthSelect"
      when:
        - rhel10cis_allow_authselect_updates
        - rhel10cis_disruption_high
      ansible.builtin.replace:
        path: "/etc/authselect/custom/{{ rhel10cis_authselect_custom_profile_name }}/{{ item }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_pwhistory\.so\b.*?)\s+remember\s*=\s*\S+(.*)$
        replace: \1\2
      loop:
        - password
        - system
      notify: Authselect update

- name: "5.3.2.3.2 | PATCH | Ensure password history is enforced for the root user"
  when: rhel10cis_rule_5_3_2_3_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.2.3.2
    - pam
    - NIST800-53R5_IA-5
  ansible.builtin.lineinfile:
    path: "/etc/security/pwhistory.conf"
    regexp: '^\s*#?\s*enforce_for_root\b'
    line: enforce_for_root

- name: "5.3.2.3.3 | PATCH | Ensure pam_pwhistory includes use_authtok"
  when:
    - rhel10cis_rule_5_3_2_3_3
    - rhel10cis_disruption_high
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.2.3.3
    - pam
    - NIST800-53R5_IA-5
  block:
    - name: "5.3.2.3.3 | PATCH | Ensure pam_pwhistory includes use_authtok | pam files NOT AuthSelect"
      when: not rhel10cis_allow_authselect_updates
      ansible.builtin.replace:
        path: "/etc/pam.d/{{ item }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_pwhistory\.so\b)(?!.*\buse_authtok\b)(.*)$
        replace: \1 use_authtok\2
      loop:
        - password
        - system

    - name: "5.3.2.3.3 | PATCH | Ensure pam_pwhistory includes use_authtok | pam files AuthSelect"
      when: rhel10cis_allow_authselect_updates
      ansible.builtin.replace:
        path: "/etc/authselect/custom/{{ rhel10cis_authselect_custom_profile_name }}/{{ item }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_pwhistory\.so\b)(?!.*\buse_authtok\b)(.*)$
        replace: \1 use_authtok\2
      loop:
        - password
        - system
      notify: Authselect update
