---

- name: "5.3.2.4.1 | PATCH | Ensure pam_unix does not include nullok"
  when:
    - rhel10cis_rule_5_3_2_4_1
    - rhel10cis_disruption_high
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.2.4.1
    - pam
    - NIST800-53R5_CM-6
  block:
    - name: "5.3.2.4.1 | PATCH | Ensure pam_unix does not include nullok | capture state"
      ansible.builtin.shell: |
        set -o pipefail
        grep -E "pam_unix.so.*nullok" /etc/pam.d/*-auth | cut -d ':' -f1 | uniq
      args:
        executable: "{{ rhel10cis_shell_executable }}"
      changed_when: false
      check_mode: false
      failed_when: discovered_pam_nullok.rc not in [ 0, 1 ]
      register: discovered_pam_nullok

    - name: "5.3.2.4.1 | PATCH | Ensure pam_unix does not include nullok | Ensure nullok removed"
      when:
        - discovered_pam_nullok.stdout | length > 0
        - not rhel10cis_allow_authselect_updates
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: ^(\s*(?:auth|account|password|session)\s+\S+\s+pam_unix\.so\b.*?)\s+nullok\b(.*)$
        replace: \1\2
      loop: "{{ discovered_pam_nullok.stdout_lines }}"

    - name: "5.3.2.4.1 | PATCH | Ensure pam_unix does not include nullok | Remove nullok from pam files AuthSelect"
      when:
        - rhel10cis_allow_authselect_updates
        - "'without-nullok' not in prelim_authselect_current_profile.stdout"
      ansible.builtin.command: authselect enable-feature without-nullok
      changed_when: true

- name: "5.3.2.4.2 | PATCH | Ensure pam_unix does not include remember"
  when:
    - rhel10cis_rule_5_3_2_4_2
    - rhel10cis_disruption_high
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - pam
    - rule_5.3.2.4.2
    - NIST800-53R5_NA
  block:
    - name: "5.3.2.4.2 | PATCH | Ensure pam_unix does not include remember | Remove remember from pam files NOT AuthSelect"
      when: not rhel10cis_allow_authselect_updates
      ansible.builtin.replace:
        path: "/etc/pam.d/{{ item }}-auth"
        regexp: ^(\s*password\s+\S+\s+pam_unix\.so\b.*?)\s+remember\s*=\s*\S+(.*)$
        replace: \1\2
      loop:
        - password
        - system

    - name: "5.3.2.4.2 | PATCH | Ensure pam_unix does not include remember | Remove remember from pam files AuthSelect"
      when: rhel10cis_allow_authselect_updates
      ansible.builtin.replace:
        path: "/etc/authselect/custom/{{ rhel10cis_authselect_custom_profile_name }}/{{ item }}-auth"
        regexp: ^(\s*password\s+\S+\s+pam_unix\.so\b.*?)\s+remember\s*=\s*\S+(.*)$
        replace: \1\2
      loop:
        - password
        - system
      notify: Authselect update

- name: "5.3.2.4.3 | PATCH | Ensure pam_unix includes a strong password hashing algorithm"
  when:
    - rhel10cis_rule_5_3_2_4_3
    - rhel10cis_disruption_high
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - pam
    - rule_5.3.2.4.3
    - NIST800-53R5_IA-5
  vars:
    discovered_pam_unix_hash_edits:
      - regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_unix\.so\b.*?\s)(?:md5|bigcrypt|sha256|blowfish|gost_yescrypt|sha512|yescrypt)\b
        replace: \1{{ rhel10cis_passwd_hash_algo }}
      - regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_unix\.so\b)(?!.*\b(?:md5|bigcrypt|sha256|blowfish|gost_yescrypt|sha512|yescrypt)\b)(.*)$
        replace: \1 {{ rhel10cis_passwd_hash_algo }}\2
  block:
    - name: "5.3.2.4.3 | PATCH | Ensure pam_unix includes a strong password hashing algorithm | Set hash algorithm in pam files NOT AuthSelect"
      when: not rhel10cis_allow_authselect_updates
      ansible.builtin.replace:
        path: "/etc/pam.d/{{ item.0 }}-auth"
        regexp: "{{ item.1.regexp }}"
        replace: "{{ item.1.replace }}"
      loop: "{{ ['password', 'system'] | product(discovered_pam_unix_hash_edits) | list }}"

    - name: "5.3.2.4.3 | PATCH | Ensure pam_unix includes a strong password hashing algorithm | Set hash algorithm in pam files AuthSelect"
      when: rhel10cis_allow_authselect_updates
      ansible.builtin.replace:
        path: "/etc/authselect/custom/{{ rhel10cis_authselect_custom_profile_name }}/{{ item.0 }}-auth"
        regexp: "{{ item.1.regexp }}"
        replace: "{{ item.1.replace }}"
      loop: "{{ ['password', 'system'] | product(discovered_pam_unix_hash_edits) | list }}"
      notify: Authselect update

- name: "5.3.2.4.4 | PATCH | Ensure pam_unix includes use_authtok"
  when:
    - rhel10cis_rule_5_3_2_4_4
    - rhel10cis_disruption_high
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - pam
    - rule_5.3.2.4.4
    - NIST800-53R5_IA-5
  block:
    - name: "5.3.2.4.4 | PATCH | Ensure pam_unix includes use_authtok | pam files NOT AuthSelect"
      when: not rhel10cis_allow_authselect_updates
      ansible.builtin.replace:
        path: "/etc/pam.d/{{ item }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_unix\.so\b)(?!.*\buse_authtok\b)(.*)$
        replace: \1\2 use_authtok
      loop:
        - password
        - system

    - name: "5.3.2.4.4 | PATCH | Ensure pam_unix includes use_authtok | pam files AuthSelect"
      when: rhel10cis_allow_authselect_updates
      ansible.builtin.replace:
        path: "/etc/authselect/custom/{{ rhel10cis_authselect_custom_profile_name }}/{{ item }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_unix\.so\b)(?!.*\buse_authtok\b)(.*)$
        replace: \1\2 use_authtok
      loop:
        - password
        - system
      notify: Authselect update
